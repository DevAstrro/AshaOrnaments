<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asha Ornaments — The Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #faf7f2;
            --ink: #1a1612;
            --gold: #b8964e;
            --gold-light: #d4b06a;
            --gold-pale: rgba(184,150,78,0.12);
            --muted: #8a8278;
            --border: rgba(26,22,18,0.08);
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--ink);
            overflow-x: hidden;
        }

        /* ── CURSOR ── */
        .cursor {
            width: 8px; height: 8px;
            background: var(--gold);
            border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width .2s, height .2s, background .2s;
        }
        .cursor-ring {
            width: 32px; height: 32px;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9998;
            transform: translate(-50%, -50%);
            transition: all .15s ease;
            opacity: 0.6;
        }
        body:has(.card:hover) .cursor { width: 60px; height: 60px; background: var(--gold-pale); }
        body:has(.card:hover) .cursor-ring { opacity: 0; }

        /* ── NAV ── */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 500;
            height: 72px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 48px;
            background: rgba(250,247,242,0.88);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            transition: all 0.4s;
        }
        nav.scrolled { height: 60px; background: rgba(250,247,242,0.96); }

        .nav-back {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--muted);
            font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
            font-weight: 500; transition: color 0.3s, gap 0.3s;
        }
        .nav-back:hover { color: var(--gold); gap: 14px; }
        .nav-back svg { width: 16px; height: 16px; transition: transform 0.3s; }
        .nav-back:hover svg { transform: translateX(-3px); }

        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.45rem; font-weight: 600; letter-spacing: 0.22em;
            color: var(--ink); text-decoration: none;
            text-transform: uppercase;
        }

        .nav-cart {
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; color: var(--muted);
            font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
            font-weight: 500; transition: color 0.3s;
            background: none; border: none; font-family: 'DM Sans', sans-serif;
        }
        .nav-cart:hover { color: var(--gold); }
        .cart-badge {
            width: 22px; height: 22px;
            background: var(--ink); color: var(--white);
            border-radius: 50%; font-size: 0.7rem;
            display: flex; align-items: center; justify-content: center;
            font-weight: 500; transition: background 0.3s, transform 0.2s;
        }
        .cart-badge.bump { transform: scale(1.4); background: var(--gold); }

        /* ── HERO ── */
        .hero {
            height: 62vh; min-height: 400px;
            position: relative; overflow: hidden;
            display: flex; align-items: flex-end; justify-content: center;
            margin-top: 72px;
        }
        .hero-img {
            position: absolute; inset: 0;
            background: url('https://images.unsplash.com/photo-1601121141461-9d6647bca1ed?q=90&w=2400&auto=format&fit=crop') center/cover;
            transform: scale(1.08);
            transition: transform 8s ease;
        }
        .hero.loaded .hero-img { transform: scale(1); }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(250,247,242,0) 0%, rgba(250,247,242,0.15) 50%, rgba(250,247,242,0.95) 100%);
        }
        .hero-title {
            position: relative; z-index: 2;
            text-align: center; padding-bottom: 60px;
            opacity: 0; transform: translateY(24px);
            animation: riseIn 1s ease 0.4s forwards;
        }
        .hero-title h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 7vw, 6rem);
            font-weight: 300; line-height: 1;
            letter-spacing: 0.06em;
            color: var(--ink);
        }
        .hero-title h1 em { font-style: italic; color: var(--gold); }
        .hero-title p {
            margin-top: 12px;
            font-size: 0.78rem; letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--muted); font-weight: 400;
        }
        .hero-rule {
            width: 40px; height: 1px; background: var(--gold);
            margin: 14px auto 0; opacity: 0.7;
        }

        /* ── FILTER BAR ── */
        .filter-bar {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; padding: 0 20px 50px;
            flex-wrap: wrap;
            opacity: 0; animation: riseIn 0.8s ease 0.9s forwards;
        }
        .filter-btn {
            padding: 8px 22px;
            border: 1px solid var(--border);
            background: transparent; color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
            cursor: pointer; border-radius: 100px;
            transition: all 0.25s;
        }
        .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
        .filter-btn.active {
            background: var(--ink); color: var(--white);
            border-color: var(--ink);
        }

        /* ── PRODUCT GRID ── */
        .container {
            max-width: 1280px; margin: 0 auto;
            padding: 0 32px 120px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2px;
        }

        .card {
            cursor: pointer; position: relative;
            background: var(--white);
            overflow: hidden;
            opacity: 0; transform: translateY(30px);
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s, opacity 0.55s;
        }
        .card.visible { opacity: 1; transform: translateY(0); }
        .card:hover { transform: translateY(-6px); z-index: 10; box-shadow: 0 30px 70px rgba(26,22,18,0.12); }

        .card-media {
            aspect-ratio: 3/4; overflow: hidden; position: relative;
        }
        .card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card:hover img { transform: scale(1.07); }

        .card-tag {
            position: absolute; top: 16px; left: 16px;
            background: var(--white); color: var(--gold);
            font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
            padding: 5px 12px; border-radius: 100px; font-weight: 500;
            opacity: 0; transform: translateY(6px);
            transition: all 0.3s ease 0.05s;
        }
        .card:hover .card-tag { opacity: 1; transform: translateY(0); }

        .card-quick-add {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(250,247,242,0.95); backdrop-filter: blur(8px);
            padding: 16px 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
            font-weight: 500; color: var(--ink);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            gap: 8px;
        }
        .card:hover .card-quick-add { transform: translateY(0); }
        .card-quick-add svg { width: 14px; height: 14px; }

        .card-info {
            padding: 20px 22px 26px;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-top: 1px solid var(--border);
        }
        .card-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem; font-weight: 400; line-height: 1.2;
            color: var(--ink); letter-spacing: 0.02em;
        }
        .card-sub {
            font-size: 0.72rem; color: var(--muted);
            margin-top: 3px; letter-spacing: 0.05em;
        }
        .card-price {
            font-size: 0.95rem; color: var(--gold);
            font-weight: 500; white-space: nowrap;
        }

        /* ── PRODUCT DETAIL PANEL ── */
        #detail-panel {
            position: fixed; inset: 0; z-index: 800;
            display: grid; grid-template-columns: 1fr 1fr;
            pointer-events: none;
        }
        #detail-panel.open { pointer-events: all; }

        .detail-backdrop {
            position: fixed; inset: 0; z-index: 799;
            background: rgba(26,22,18,0.5);
            opacity: 0; transition: opacity 0.5s;
            backdrop-filter: blur(4px);
        }
        #detail-panel.open .detail-backdrop { opacity: 1; }

        .detail-img-col {
            position: relative; overflow: hidden;
            transform: translateX(-100%);
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 801;
        }
        #detail-panel.open .detail-img-col { transform: translateX(0); }
        .detail-img-col img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .detail-info-col {
            background: var(--cream);
            display: flex; flex-direction: column; justify-content: center;
            padding: 80px 64px;
            transform: translateX(100%);
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 801; position: relative; overflow-y: auto;
        }
        #detail-panel.open .detail-info-col { transform: translateX(0); }

        .detail-close {
            position: absolute; top: 28px; right: 32px;
            background: none; border: none; cursor: pointer;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); transition: color 0.2s, transform 0.2s;
        }
        .detail-close:hover { color: var(--ink); transform: rotate(90deg); }
        .detail-close svg { width: 22px; height: 22px; }

        .detail-eyebrow {
            font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
            color: var(--gold); font-weight: 500; margin-bottom: 18px;
        }
        .detail-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.2rem, 3.5vw, 3.4rem); font-weight: 300;
            line-height: 1.05; letter-spacing: 0.03em;
            margin-bottom: 10px;
        }
        .detail-price {
            font-size: 1.5rem; color: var(--gold); font-weight: 400;
            font-family: 'Cormorant Garamond', serif; margin-bottom: 32px;
        }
        .detail-divider {
            height: 1px; background: var(--border); margin-bottom: 32px;
        }
        .detail-desc {
            font-size: 1rem; line-height: 1.8; color: #5a5550;
            margin-bottom: 40px; font-weight: 300;
        }
        .detail-meta {
            display: flex; flex-direction: column; gap: 8px; margin-bottom: 40px;
        }
        .detail-meta-row {
            display: flex; justify-content: space-between;
            font-size: 0.8rem; padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
        }
        .detail-meta-row span:last-child { color: var(--ink); font-weight: 500; }

        .detail-actions { display: flex; flex-direction: column; gap: 12px; }
        .btn-add-cart {
            padding: 18px 40px;
            background: var(--ink); color: var(--white);
            border: 1.5px solid var(--ink);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase;
            font-weight: 500; cursor: pointer; border-radius: 3px;
            transition: background 0.3s, color 0.3s, transform 0.2s;
        }
        .btn-add-cart:hover { background: var(--gold); border-color: var(--gold); transform: translateY(-2px); }
        .btn-buy-now {
            padding: 18px 40px;
            background: transparent; color: var(--muted);
            border: 1.5px solid var(--border);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase;
            font-weight: 500; cursor: pointer; border-radius: 3px;
            transition: all 0.3s;
        }
        .btn-buy-now:hover { border-color: var(--muted); color: var(--ink); transform: translateY(-2px); }

        /* ── CART DRAWER ── */
        .cart-overlay {
            position: fixed; inset: 0; z-index: 900;
            background: rgba(26,22,18,0.4); backdrop-filter: blur(4px);
            opacity: 0; pointer-events: none; transition: opacity 0.35s;
        }
        .cart-overlay.open { opacity: 1; pointer-events: all; }

        .cart-drawer {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: min(440px, 100vw); z-index: 901;
            background: var(--cream);
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex; flex-direction: column;
            box-shadow: -20px 0 60px rgba(26,22,18,0.08);
        }
        .cart-drawer.open { transform: translateX(0); }

        .cart-head {
            padding: 32px 32px 24px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .cart-head h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem; font-weight: 400;
        }
        .cart-close-btn {
            background: none; border: none; cursor: pointer;
            color: var(--muted); transition: color 0.2s, transform 0.2s;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
        }
        .cart-close-btn:hover { color: var(--ink); transform: rotate(90deg); }
        .cart-close-btn svg { width: 20px; height: 20px; }

        .cart-body { flex: 1; overflow-y: auto; padding: 24px 32px; }

        .empty-msg {
            text-align: center; padding: 60px 0;
            color: var(--muted); font-size: 0.9rem; line-height: 1.8;
        }
        .empty-msg .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 12px; opacity: 0.4; }

        .cart-item {
            display: flex; gap: 16px; padding: 20px 0;
            border-bottom: 1px solid var(--border);
            animation: riseIn 0.3s ease;
        }
        .cart-item img {
            width: 72px; height: 90px; object-fit: cover;
            border-radius: 4px; flex-shrink: 0;
        }
        .ci-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .ci-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem; font-weight: 400;
        }
        .ci-price { font-size: 0.85rem; color: var(--gold); font-weight: 500; }
        .ci-remove {
            background: none; border: none; cursor: pointer;
            font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--muted); transition: color 0.2s; padding: 0;
            font-family: 'DM Sans', sans-serif;
        }
        .ci-remove:hover { color: #c0392b; }

        .cart-foot {
            padding: 24px 32px 32px;
            border-top: 1px solid var(--border);
        }
        .cart-total-row {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 20px;
        }
        .cart-total-label { font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
        .cart-total-val {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem; font-weight: 300; color: var(--ink);
        }
        .checkout-btn {
            width: 100%; padding: 18px;
            background: var(--ink); color: var(--white);
            border: none; border-radius: 3px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.78rem; letter-spacing: 0.22em; text-transform: uppercase;
            font-weight: 500; cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .checkout-btn:hover { background: var(--gold); transform: translateY(-2px); }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: var(--ink); color: var(--white);
            padding: 14px 28px; border-radius: 100px;
            font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase;
            font-weight: 500; z-index: 1000;
            opacity: 0; transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex; align-items: center; gap: 10px;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-dot { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; flex-shrink: 0; }

        /* ── FOOTER ── */
        footer {
            text-align: center; padding: 48px 20px;
            border-top: 1px solid var(--border);
            background: var(--white);
        }
        footer .f-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem; letter-spacing: 0.25em; text-transform: uppercase;
            color: var(--ink); margin-bottom: 10px;
        }
        footer .f-sub { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.08em; }
        footer .f-email { color: var(--gold); font-weight: 500; }

        /* ── ANIMATIONS ── */
        @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            nav { padding: 0 20px; }
            .hero-title h1 { font-size: 2.8rem; }
            #detail-panel { grid-template-columns: 1fr; }
            .detail-img-col { display: none; }
            .detail-info-col { transform: translateY(100%); padding: 60px 28px 40px; }
            #detail-panel.open .detail-info-col { transform: translateY(0); }
            .container { padding: 0 12px 80px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 1px; }
            .card-info { padding: 14px 14px 18px; }
            .card-name { font-size: 1rem; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <!-- NAV -->
    <nav id="main-nav">
        <a href="index.html" class="nav-back">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Home
        </a>
        <a href="#" class="nav-logo">Asha Ornaments</a>
        <button class="nav-cart" onclick="toggleCart()">
            Cart
            <span class="cart-badge" id="nav-count">0</span>
        </button>
    </nav>

    <!-- HERO -->
    <div class="hero" id="hero">
        <div class="hero-img"></div>
        <div class="hero-overlay"></div>
        <div class="hero-title">
            <h1>The <em>Collection</em></h1>
            <p>Curated Handcrafted Excellence</p>
            <div class="hero-rule"></div>
        </div>
    </div>

    <!-- FILTERS -->
    <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="all">All Pieces</button>
        <button class="filter-btn" data-filter="gold">Gold</button>
        <button class="filter-btn" data-filter="silver">Silver</button>
        <button class="filter-btn" data-filter="stone">Stone</button>
        <button class="filter-btn" data-filter="clay">Clay</button>
    </div>

    <!-- GRID -->
    <div class="container">
        <div class="grid" id="grid"></div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="f-logo">Asha Ornaments</div>
        <div class="f-sub">Made with ❤️ by a teacher &nbsp;·&nbsp; <span class="f-email">ashascollection@gmail.com</span></div>
    </footer>

    <!-- PRODUCT DETAIL PANEL -->
    <div id="detail-panel">
        <div class="detail-backdrop" onclick="closeDetail()"></div>
        <div class="detail-img-col">
            <img id="d-img" src="" alt="">
        </div>
        <div class="detail-info-col">
            <button class="detail-close" onclick="closeDetail()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div class="detail-eyebrow" id="d-tag">Handcrafted</div>
            <h2 class="detail-name" id="d-name"></h2>
            <div class="detail-price" id="d-price"></div>
            <div class="detail-divider"></div>
            <p class="detail-desc" id="d-desc"></p>
            <div class="detail-meta">
                <div class="detail-meta-row"><span>Material</span><span id="d-mat">—</span></div>
                <div class="detail-meta-row"><span>Origin</span><span>Handmade in India</span></div>
                <div class="detail-meta-row"><span>Care</span><span>Store in soft pouch</span></div>
            </div>
            <div class="detail-actions">
                <button class="btn-add-cart" onclick="addToCart()">Add to Cart</button>
                <button class="btn-buy-now" onclick="showToast('Checkout coming soon')">Buy Now</button>
            </div>
        </div>
    </div>

    <!-- CART -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-head">
            <h3>Your Cart</h3>
            <button class="cart-close-btn" onclick="toggleCart()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="cart-body" id="cart-body"></div>
        <div class="cart-foot">
            <div class="cart-total-row">
                <span class="cart-total-label">Order Total</span>
                <span class="cart-total-val" id="cart-total">₹0</span>
            </div>
            <button class="checkout-btn" onclick="showToast('Checkout coming soon')">Proceed to Checkout</button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <span class="toast-dot"></span>
        <span id="toast-msg">Added to cart</span>
    </div>

    <script>
        // ── DATA ──
        const DEFAULT_PRODUCTS = [
            { id:1, name:"Golden Lotus",   price:1499, tag:"Gold",   material:"24k Gold-plated Brass",    filter:"gold",   desc:"Hand-carved brass ornament plated in 24k gold. Each lotus petal is individually shaped by a master artisan, requiring over six hours of meticulous handwork.",  img:"https://images.unsplash.com/photo-1602173574767-37ac01994b2a?w=900&q=85" },
            { id:2, name:"Emerald Drop",   price:1850, tag:"Stone",  material:"Natural Emerald & Silk",   filter:"stone",  desc:"Natural emerald beads hand-selected for clarity and color, strung on the finest Indian silk. A piece that carries centuries of gemstone tradition.", img:"https://images.unsplash.com/photo-1573408301185-9146fe634ad0?w=900&q=85" },
            { id:3, name:"Clay Bell",      price:999,  tag:"Clay",   material:"Hand-painted Terracotta",  filter:"clay",   desc:"Hand-painted terracotta clay bell fired in a traditional kiln. The earthy pigments are natural mineral dyes applied in three patient coats.", img:"https://images.unsplash.com/photo-1590736969955-71cc94801759?w=900&q=85" },
            { id:4, name:"Silver Leaf",    price:1250, tag:"Silver", material:"Recycled Sterling Silver", filter:"silver", desc:"Recycled sterling silver hammered into a perfect leaf over a hand-carved wooden form. No two leaves are alike — each carries its own subtle texture.", img:"https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=900&q=85" },
            { id:5, name:"Ruby Charm",     price:1999, tag:"Stone",  material:"Raw Ruby & Bronze",        filter:"stone",  desc:"A raw ruby stone sourced from the Mysore hills, set in ancient bronze using a traditional bezel technique passed through three generations of craftsmen.", img:"https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=900&q=85" },
            { id:6, name:"Onyx Star",      price:1599, tag:"Stone",  material:"Black Onyx",               filter:"stone",  desc:"Black onyx carved into a celestial star using diamond-tipped tools. The deep black surface is polished to a mirror-like finish over three days.", img:"https://images.unsplash.com/photo-1611085583191-a3b181a88401?w=900&q=85" }
        ];

        // Merge: admin products (newest first) + default products
        function getAllProducts() {
            try {
                const saved = JSON.parse(localStorage.getItem('asha_products')) || [];
                return [...saved, ...DEFAULT_PRODUCTS];
            } catch { return DEFAULT_PRODUCTS; }
        }

        let products = getAllProducts();
        let cart = [];
        let openId = null;

        // ── RENDER GRID ──
        function renderGrid(filter = 'all') {
            products = getAllProducts(); // always fresh
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const shown = filter === 'all' ? products : products.filter(p => p.filter === filter);
            shown.forEach((p, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.transitionDelay = `${i * 60}ms`;
                card.innerHTML = `
                    <div class="card-media">
                        <img src="${p.img}" alt="${p.name}" loading="lazy">
                        <div class="card-tag">${p.tag}</div>
                        <div class="card-quick-add" onclick="quickAdd(event, ${p.id})">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                            Quick Add
                        </div>
                    </div>
                    <div class="card-info">
                        <div>
                            <div class="card-name">${p.name}</div>
                            <div class="card-sub">${p.material}</div>
                        </div>
                        <div class="card-price">₹${p.price.toLocaleString('en-IN')}</div>
                    </div>
                `;
                card.addEventListener('click', () => openDetail(p.id));
                grid.appendChild(card);
                requestAnimationFrame(() => {
                    setTimeout(() => card.classList.add('visible'), 20 + i * 60);
                });
            });
        }
        renderGrid();

        // ── FILTER ──
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGrid(btn.dataset.filter);
            });
        });

        // ── DETAIL ──
        function openDetail(id) {
            openId = id;
            const p = products.find(x => x.id === id);
            document.getElementById('d-img').src = p.img;
            document.getElementById('d-name').textContent = p.name;
            document.getElementById('d-price').textContent = '₹' + p.price.toLocaleString('en-IN');
            document.getElementById('d-desc').textContent = p.desc;
            document.getElementById('d-tag').textContent = p.tag;
            document.getElementById('d-mat').textContent = p.material;
            document.getElementById('detail-panel').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeDetail() {
            document.getElementById('detail-panel').classList.remove('open');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => { if(e.key === 'Escape') { closeDetail(); if(document.getElementById('cart-drawer').classList.contains('open')) toggleCart(); } });

        // ── CART ──
        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('open');
            document.getElementById('cart-overlay').classList.toggle('open');
        }
        function addToCart() {
            const p = products.find(x => x.id === openId);
            cart.push({ ...p, cartId: Date.now() });
            updateCart();
            closeDetail();
            setTimeout(() => {
                if (!document.getElementById('cart-drawer').classList.contains('open')) toggleCart();
            }, 300);
            showToast(`${p.name} added to cart`);
        }
        function quickAdd(e, id) {
            e.stopPropagation();
            const p = products.find(x => x.id === id);
            cart.push({ ...p, cartId: Date.now() });
            updateCart();
            showToast(`${p.name} added to cart`);
        }
        function removeFromCart(cartId) {
            cart = cart.filter(i => i.cartId !== cartId);
            updateCart();
        }
        function updateCart() {
            const badge = document.getElementById('nav-count');
            badge.textContent = cart.length;
            badge.classList.add('bump');
            setTimeout(() => badge.classList.remove('bump'), 300);

            const total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('cart-total').textContent = '₹' + total.toLocaleString('en-IN');

            const body = document.getElementById('cart-body');
            if (cart.length === 0) {
                body.innerHTML = `<div class="empty-msg"><span class="empty-icon">◇</span>Your cart is empty.<br>Explore the collection above.</div>`;
                return;
            }
            body.innerHTML = cart.map(i => `
                <div class="cart-item">
                    <img src="${i.img}" alt="${i.name}">
                    <div class="ci-details">
                        <div class="ci-name">${i.name}</div>
                        <div class="ci-price">₹${i.price.toLocaleString('en-IN')}</div>
                        <button class="ci-remove" onclick="removeFromCart(${i.cartId})">Remove</button>
                    </div>
                </div>
            `).join('');
        }
        updateCart();

        // ── TOAST ──
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
        }

        // ── CURSOR ──
        const cur = document.getElementById('cursor');
        const ring = document.getElementById('cursor-ring');
        let mx = 0, my = 0, rx = 0, ry = 0;
        document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; cur.style.left = mx + 'px'; cur.style.top = my + 'px'; });
        function animRing() { rx += (mx - rx) * 0.14; ry += (my - ry) * 0.14; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(animRing); }
        animRing();

        // ── NAV SCROLL ──
        window.addEventListener('scroll', () => {
            document.getElementById('main-nav').classList.toggle('scrolled', window.scrollY > 40);
        });

        // ── HERO LOAD ANIMATION ──
        setTimeout(() => document.getElementById('hero').classList.add('loaded'), 100);
    </script>
</body>
</html>
